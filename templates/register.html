{% extends "base.html" %}

{% block title %}Register | Agri-Nexus{% endblock %}

{% block content %}

<div class="page">

    <div class="container" style="max-width:700px;">

        <div class="section-title">
            <h1>Join Agri-Nexus 🌱</h1>
            <p>Create your digital farmer profile.</p>
        </div>

        <div class="card">

            <form method="POST">

                {% csrf_token %}

                <div class="form-group">
                    <label>Username</label>
                    <input class="form-control"
                           type="text"
                           name="username"
                           required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input class="form-control"
                           type="email"
                           name="email"
                           required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input class="form-control"
                           type="password"
                           name="password"
                           required>
                </div>

                <div class="form-group">
                    <label>Phone</label>
                    <input class="form-control"
                           type="text"
                           name="phone">
                </div>

                <div style="display:grid;
                            grid-template-columns:1fr 1fr;
                            gap:15px;">

                    <div class="form-group">
                        <label>Village</label>
                        <input class="form-control"
                               type="text"
                               name="village"
                               required>
                    </div>

                    <div class="form-group">
                        <label>District</label>
                        <input class="form-control"
                               type="text"
                               name="district"
                               required>
                    </div>

                </div>

                <div class="form-group">
                    <label>State</label>
                    <input class="form-control"
                           type="text"
                           name="state"
                           value="Andhra Pradesh">
                </div>

                <div class="form-group">
                    <label>Land Area (acres)</label>
                    <input class="form-control"
                           type="number"
                           step="0.01"
                           name="land_area"
                           required>
                </div>

                <button class="btn btn-primary"
                        type="submit">
                    Create Farmer Account →
                </button>

            </form>

            <p style="margin-top:20px;
                      color:var(--muted);
                      font-size:14px;">

                Already registered?
                <a href="{% url 'login' %}"
                   style="color:var(--green);font-weight:700;">
                    Login
                </a>

            </p>

        </div>

    </div>

</div>

{% endblock %}
