{% extends "base.html" %}

{% block title %}Login | Agri-Nexus{% endblock %}

{% block content %}

<div class="page">

    <div class="container" style="max-width:480px;">

        <div class="section-title"
             style="text-align:center;">

            <h1>Welcome back 🌾</h1>

            <p>
                Access your Agri-Nexus farm command center.
            </p>

        </div>

        <div class="card">

            <form method="POST">

                {% csrf_token %}

                <div class="form-group">
                    <label>Username</label>

                    <input class="form-control"
                           type="text"
                           name="username"
                           required>
                </div>

                <div class="form-group">
                    <label>Password</label>

                    <input class="form-control"
                           type="password"
                           name="password"
                           required>
                </div>

                <button class="btn btn-primary"
                        style="width:100%;"
                        type="submit">

                    Login to Agri-Nexus →

                </button>

            </form>

            <p style="text-align:center;
                      margin-top:20px;
                      color:var(--muted);
                      font-size:14px;">

                New farmer?

                <a href="{% url 'register' %}"
                   style="color:var(--green);
                          font-weight:700;">

                    Create account

                </a>

            </p>

        </div>

    </div>

</div>

{% endblock %}
